<style>
  :root {
    --fond: #f2f5f6; --carte: #ffffff; --texte: #12212b; --discret: #566873; --bord: #d9e1e5;
    --marque: #12364f; --sur-marque: #ffffff; --clair-marque: #b9cfdc;
    --accent: #0b7a75; --accent-texte: #0a6a65; --doux: #e1f0ef;
    --ambre: #fbefd9; --ambre-t: #8a4a00; --rouge: #fbe4e2; --rouge-t: #a11e17; --neutre: #e8edf1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0d1820; --carte: #14232e; --texte: #e6eef3; --discret: #9db0bc; --bord: #29404f;
      --marque: #0a2233; --sur-marque: #e6eef3; --clair-marque: #9db0bc;
      --accent: #4cc2bb; --accent-texte: #4cc2bb; --doux: #1a3340;
      --ambre: #3a2c10; --ambre-t: #f0b04a; --rouge: #3d1f1d; --rouge-t: #f2a39d; --neutre: #1d313e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
  header.haut { background: var(--marque); color: var(--sur-marque); padding: 14px 20px 20px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  header.haut .retour { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--clair-marque); text-decoration: none; font-weight: 600; font-size: 14px; background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; }
  header.haut h1 { margin: 2px 0 0; font-size: 26px; line-height: 1.15; }
  header.haut .sous { margin-top: 6px; font-size: 14px; color: var(--clair-marque); }
  .contenu { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 14px 16px; }
  .carte h2 { margin: 0 0 8px; font-size: 18px; }
  .info { color: var(--discret); font-size: 13.5px; margin: 4px 0 0; }
  .vide { color: var(--discret); text-align: center; padding: 18px 8px; }
  button, input, select { font: inherit; color: inherit; }
  button.principal { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button.principal { color: #06191d; } }
  button.second { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--carte); color: var(--accent-texte); font-weight: 700; cursor: pointer; }
  input[type=text], select { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--bord); border-radius: 10px; background: var(--carte); }
  .puces { display: flex; gap: 8px; flex-wrap: wrap; }
  .puces button { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--bord); background: var(--carte); font-weight: 700; cursor: pointer; }
  .puces button[aria-pressed="true"] { background: var(--marque); color: var(--sur-marque); border-color: var(--marque); }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--doux); color: var(--accent-texte); }
  .badge.ambre { background: var(--ambre); color: var(--ambre-t); }
  .badge.rouge { background: var(--rouge); color: var(--rouge-t); }
  .badge.neutre { background: var(--neutre); color: var(--texte); }
  .ligne { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--bord); }
  .ligne:first-of-type { border-top: 0; }
  .ligne .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .gras { font-weight: 700; }
  .eleve { display: flex; gap: 14px; align-items: center; }
  .avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--doux); color: var(--accent-texte); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
  .vitaux { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .vital { display: block; text-decoration: none; color: inherit; background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 12px 14px; min-height: 92px; }
  .vital b { display: block; font-size: 24px; line-height: 1.2; }
  .vital span { display: block; font-size: 13px; color: var(--discret); }
  .tuiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tuile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 84px; padding: 8px 4px; border-radius: 14px; background: var(--carte); border: 1px solid var(--bord); text-decoration: none; color: var(--texte); font-size: 13.5px; font-weight: 600; text-align: center; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .tuile svg.i { color: var(--accent-texte); }
  .piste { height: 10px; background: var(--doux); border-radius: 5px; overflow: hidden; }
  .piste i { display: block; height: 100%; background: var(--accent); }
  .piste.rouge i { background: #c0392b; }
  .resume { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  .resume div { background: var(--doux); border-radius: 10px; padding: 10px; }
  .resume b { display: block; font-size: 20px; }
  .resume span { font-size: 13px; color: var(--discret); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 4px; text-align: right; border-top: 1px solid var(--bord); }
  th:first-child, td:first-child { text-align: left; }
  thead th { border-top: 0; font-size: 13px; color: var(--discret); font-weight: 600; }
  tfoot td { font-weight: 700; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal .e { font-size: 12px; color: var(--discret); font-weight: 600; padding: 4px 0; }
  .cal .j { min-height: 40px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; background: var(--fond); }
  .cal .j.P { background: var(--doux); color: var(--accent-texte); font-weight: 700; }
  .cal .j.A { background: var(--rouge); color: var(--rouge-t); font-weight: 700; }
  .cal .j.R { background: var(--ambre); color: var(--ambre-t); font-weight: 700; }
  .cal .j.we { opacity: .45; }
  .cal .j small { font-size: 10.5px; line-height: 1; }
  .date { flex: none; width: 56px; border-radius: 10px; background: var(--marque); color: var(--sur-marque); text-align: center; padding: 6px 0; }
  .date b { display: block; font-size: 22px; line-height: 1.1; }
  .date span { font-size: 12px; color: var(--clair-marque); }
  .bulle { max-width: 88%; padding: 9px 12px; border-radius: 14px; background: var(--doux); overflow-wrap: anywhere; white-space: pre-wrap; }
  .bulle.moi { align-self: flex-end; background: var(--marque); color: var(--sur-marque); }
  .bulle small { display: block; opacity: .75; font-size: 12px; margin-top: 3px; }
  .fil { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 14px; }
  textarea { width: 100%; min-height: 96px; padding: 10px 12px; border: 1px solid var(--bord); border-radius: 10px; background: var(--carte); font: inherit; resize: vertical; margin-bottom: 10px; }
  .point { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
  details.msg { border-top: 1px solid var(--bord); padding: 4px 0; }
  details.msg:first-of-type { border-top: 0; }
  details.msg summary { display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; list-style: none; }
  details.msg summary::-webkit-details-marker { display: none; }
  details.msg p { margin: 0 0 10px 20px; white-space: pre-wrap; overflow-wrap: anywhere; }
  nav.bas { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--carte); border-top: 1px solid var(--bord); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.bas div { max-width: 560px; margin: 0 auto; display: flex; }
  nav.bas a { flex: 1; min-width: 0; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; text-decoration: none; color: var(--discret); font-weight: 500; }
  nav.bas a[aria-current="page"] { color: var(--accent-texte); font-weight: 700; box-shadow: inset 0 3px 0 var(--accent); }
  #msg { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 9; max-width: 520px; margin: 0 auto; background: var(--marque); color: var(--sur-marque); padding: 12px 14px; border-radius: 10px; }
  #msg[hidden] { display: none; }
  #impression { display: none; }
  @media print {
    #app, #msg { display: none !important; }
    #impression.actif { display: block; color: #000; background: #fff; font-family: Georgia, serif; padding: 24px; }
    #impression h1 { text-align: center; }
    #impression table { font-size: 14px; }
  }
</style>

<body>
<div id="app"></div>
<div id="impression"></div>
<div id="msg" role="status" hidden></div>

<script>
"use strict";
const CLE = "espace-ecole-v1";
const PERIODES = ["1re période", "2e période", "3e période", "4e période"];
const JOURS = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const SEUIL = 50;
const ICONES = {
  accueil: "M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6",
  notes: "M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7",
  presences: "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M9 15l2 2 4-4",
  messages: "M4 4h16v12H8l-4 4z",
  frais: "M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l2-3h12M16 14h2",
  devoirs: "M5 4h14v16H5zM9 9h6M9 13h6M9 17h3",
  horaire: "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2",
  calendrier: "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",
  documents: "M4 6h6l2 2h8v11H4z",
  contact: "M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12zM8.5 11h7M8.5 14h4"
};
const TITRES = { accueil: "Accueil", notes: "Notes et bulletin", presences: "Présences", messages: "Messages de l'école", frais: "Frais scolaires",
  devoirs: "Devoirs", horaire: "Horaire des cours", calendrier: "Calendrier scolaire", documents: "Documents", contact: "Contacter l'école" };
const ONGLETS = ["accueil", "notes", "presences", "messages", "frais"];
const LIBELLES = { accueil: "Accueil", notes: "Notes", presences: "Présences", messages: "Messages", frais: "Frais" };

// ---------- Données ----------
let S = charger();
function charger() {
  const v = { base: null, source: "", local: false, matricule: "", lus: [], faits: [], demandes: [] };
  try {
    const s = JSON.parse(localStorage.getItem(CLE));
    if (s && typeof s === "object") {
      if (s.base && Array.isArray(s.base.eleves)) v.base = s.base;
      v.matricule = typeof s.matricule === "string" ? s.matricule : "";
      v.source = s.source === "admin" ? "admin" : "";
      v.local = s.local === true;
      for (const k of ["lus", "faits", "demandes"]) if (Array.isArray(s[k])) v[k] = s[k];
    }
  } catch (e) {}
  return v;
}
const CLE_NUAGE = "espace-ecole-nuage-v1";
function sauver() {
  if (nuage) { try { localStorage.setItem(CLE_NUAGE, JSON.stringify({ matricule: S.matricule })); } catch (e) {} return; }
  try { localStorage.setItem(CLE, JSON.stringify(S.source === "admin" ? { ...S, base: null } : S)); } catch (e) { dire("Sauvegarde impossible sur ce téléphone."); } }

// Si l'administration est ouverte depuis le même dossier et le même navigateur, on lit ses données en direct.
const CLE_ADMIN = "ecole-eleves-v1";
function lireAdmin() {
  try { const d = JSON.parse(localStorage.getItem(CLE_ADMIN)); if (d && Array.isArray(d.eleves) && d.eleves.length) { d.espace = d.espace || {}; return d; } } catch (e) {}
  return null;
}
const B = () => S.base;
const EX = () => (S.base && S.base.espace) || {};
const liste = (t) => (S.base && Array.isArray(S.base[t]) ? S.base[t] : []);
const listeEx = (t) => (Array.isArray(EX()[t]) ? EX()[t] : []);
const norm = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const eleveActuel = () => liste("eleves").find((x) => norm(x.matricule) === norm(S.matricule));
const classeDe = (x) => liste("classes").find((c) => norm(c.nom) === norm(x.classe));
const nomComplet = (x) => [x.nom, x.postnom, x.prenom].filter(Boolean).join(" ");
const fmt = (v) => String(Math.round(v * 10) / 10).replace(".", ",");
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const aujourdhui = () => iso(new Date());
const dateLongue = (s) => { const d = new Date(s + "T12:00:00"); if (isNaN(d)) return String(s); return ["Dimanche", ...JOURS, "Samedi"][d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()]; };
const anneeScolaire = () => { const d = new Date(), y = d.getFullYear(); return d.getMonth() >= 8 ? y + "-" + (y + 1) : (y - 1) + "-" + y; };

// ---------- Petits outils d'interface ----------
let minuteur;
function dire(t) { const m = document.getElementById("msg"); m.textContent = t; m.hidden = false; clearTimeout(minuteur); minuteur = setTimeout(() => { m.hidden = true; }, 3000); }
function el(tag, cls, txt) { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
function icone(nom) {
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i"); s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", ICONES[nom]); s.appendChild(p); return s;
}
function bouton(txt, cls, fn) { const b = el("button", cls, txt); b.type = "button"; b.addEventListener("click", fn); return b; }
function carte(titre) { const c = el("section", "carte"); if (titre) c.appendChild(el("h2", "", titre)); return c; }
function puces(options, actuel, choisir, libelle) {
  const g = el("div", "puces"); g.setAttribute("role", "group"); g.setAttribute("aria-label", libelle);
  for (const [v, t] of options) {
    const b = bouton(t, "", () => choisir(v)); b.setAttribute("aria-pressed", String(v === actuel)); g.appendChild(b);
  }
  return g;
}

// ---------- Calculs de notes ----------
const maxMat = (m) => (m.max > 0 ? m.max : 20);
function matieresDe(x) { const c = classeDe(x); return c ? liste("matieres").filter((m) => m.classeId === c.id).sort((a, b) => a.nom.localeCompare(b.nom, "fr")) : []; }
function noteDe(x, m, p) { const n = (S.base.notes || {})[x.id + "|" + m.id + "|" + p]; return typeof n === "number" ? n : null; }
function resultat(x, mats, p) {
  let t = 0, mx = 0, n = 0;
  for (const m of mats) { const v = noteDe(x, m, p); if (v == null) continue; t += v; mx += maxMat(m); n++; }
  return { t, mx, n, pct: mx > 0 ? (t / mx) * 100 : null };
}
function classement(x, p) {
  if (nuage) { const c = ((nuage.classements || {})[x.id] || {})[p]; return c ? { place: c.place, sur: c.sur, moyenne: c.moyenne == null ? null : Number(c.moyenne) } : { place: null, sur: 0, moyenne: null }; }
  const mats = matieresDe(x);
  const camarades = liste("eleves").filter((y) => y.classe === x.classe);
  const rs = camarades.map((y) => ({ y, ...resultat(y, mats, p) })).filter((r) => r.pct != null).sort((a, b) => b.pct - a.pct);
  const moi = rs.find((r) => r.y.id === x.id);
  return { place: moi ? 1 + rs.filter((r) => r.pct > moi.pct + 1e-9).length : null, sur: rs.length, moyenne: rs.length ? rs.reduce((s, r) => s + r.pct, 0) / rs.length : null };
}
function dernierePeriode(x) {
  const mats = matieresDe(x);
  for (let p = PERIODES.length - 1; p >= 0; p--) if (resultat(x, mats, p).n) return p;
  return 0;
}
function presenceStats(x) {
  const r = listeEx("presences").filter((p) => p.eleveId === x.id);
  const P = r.filter((p) => p.statut === "P").length, R = r.filter((p) => p.statut === "R").length, A = r.filter((p) => p.statut === "A").length;
  return { P, R, A, total: P + R + A, pct: P + R + A ? ((P + R) / (P + R + A)) * 100 : null };
}
function fraisDe(x) {
  const f = (EX().frais || {})[x.id]; if (!f) return null;
  const paye = (f.paiements || []).reduce((s, p) => s + (Number(p.montant) || 0), 0);
  return { total: Number(f.total) || 0, paye, reste: Math.max(0, (Number(f.total) || 0) - paye), echeance: f.echeance || "", paiements: f.paiements || [] };
}
function messagesDe(x) {
  const c = classeDe(x);
  return listeEx("messages").filter((m) => !m.cible || m.cible === x.id || (c && m.cible === c.id)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
function devoirsDe(x) { const c = classeDe(x); return listeEx("devoirs").filter((d) => c && d.classeId === c.id).sort((a, b) => String(a.pour).localeCompare(String(b.pour))); }
function evenements(x) {
  const c = classeDe(x);
  return listeEx("calendrier").filter((e) => !e.classeId || (c && e.classeId === c.id)).sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

// ---------- Navigation ----------
const pageActuelle = () => { const h = location.hash.slice(1); return TITRES[h] ? h : "accueil"; };
window.addEventListener("hashchange", () => { rendre(); window.scrollTo(0, 0); if (typeof rafraichirEchanges === "function") rafraichirEchanges(); });

function entete(page, x) {
  const h = el("header", "haut");
  if (page !== "accueil") {
    const a = el("a", "retour"); a.href = "#accueil";
    const s = icone("accueil"); s.style.width = "18px"; s.style.height = "18px"; a.append(s, document.createTextNode("Accueil")); h.appendChild(a);
  }
  h.appendChild(el(page === "accueil" ? "div" : "div", "sous", (B().ecole && B().ecole.nom) || "Mon école"));
  h.appendChild(el("h1", "", page === "accueil" ? "Bonjour, " + (x.prenom || x.nom) : TITRES[page]));
  h.appendChild(el("div", "sous", nomComplet(x) + " · " + x.classe));
  return h;
}
function barre(page) {
  const n = el("nav", "bas"); n.setAttribute("aria-label", "Navigation principale");
  const d = el("div");
  for (const o of ONGLETS) {
    const a = el("a"); a.href = "#" + o; a.append(icone(o), el("span", "", LIBELLES[o]));
    if (o === (page === "contact" ? "messages" : page)) a.setAttribute("aria-current", "page");
    d.appendChild(a);
  }
  n.appendChild(d); return n;
}

function rendre() {
  const app = document.getElementById("app"); app.replaceChildren();
  if (S.source === "admin") { const a = lireAdmin(); if (a) S.base = a; else { S.source = ""; S.base = null; } }
  if (nuage && nuage.etat !== "pret") return ecranNuage(app);
  if (!S.base) return ecranDonnees(app);
  const x = eleveActuel();
  if (!x) return ecranConnexion(app);
  const page = pageActuelle();
  app.appendChild(entete(page, x));
  const c = el("main", "contenu"); app.appendChild(c);
  ({ accueil: pAccueil, notes: pNotes, presences: pPresences, messages: pMessages, frais: pFrais, devoirs: pDevoirs, horaire: pHoraire, calendrier: pCalendrier, documents: pDocuments, contact: pContact })[page](c, x);
  app.appendChild(barre(page));
}

// ---------- Écran 0 : données et connexion ----------

const CFG = window.SB_CONFIG;

function msgErr(e) {

async function demarrerNuage() {
  if (S.local || !CFG || !CFG.url || !CFG.key) { rendre(); return; }
  if (!window.supabase) { S.local = true; rendre(); dire("Mode sans base : la bibliothèque en ligne n'a pas pu être chargée."); return; }

async function lireNuage(t) { const { data, error } = await sb.from(t).select("*"); if (error) throw error; return data || []; }
function baseDepuis(T) {
  const e0 = T.ecole[0] || {};
  const b = { ecole: { nom: e0.nom || "" }, eleves: [], classes: [], enseignants: [], matieres: [], notes: {}, espace: { presences: [], messages: [], devoirs: [], calendrier: [], frais: {}, horaire: {} } };
  b.classes = T.classes.map((c) => ({ id: c.id, nom: c.nom }));
  const nomClasse = new Map(b.classes.map((c) => [c.id, c.nom]));
  b.matieres = T.matieres.map((m) => ({ id: m.id, classeId: m.classe_id, nom: m.nom, max: Number(m.maximum) }));
  b.eleves = T.eleves.map((x) => ({ id: x.id, matricule: x.matricule, nom: x.nom, postnom: x.postnom || "", prenom: x.prenom, sexe: x.sexe, classe: nomClasse.get(x.classe_id) || "" }));
  for (const n of T.notes) b.notes[n.eleve_id + "|" + n.matiere_id + "|" + n.periode] = Number(n.valeur);
  b.espace.presences = T.presences.map((p) => ({ eleveId: p.eleve_id, date: String(p.date).slice(0, 10), statut: p.statut }));
  for (const f of T.frais) b.espace.frais[f.eleve_id] = { total: Number(f.total), echeance: f.echeance || "", paiements: [] };
  for (const p of T.paiements) { const f = b.espace.frais[p.eleve_id]; if (f) f.paiements.push({ date: p.date, montant: Number(p.montant), recu: p.recu }); }
  b.espace.devoirs = T.devoirs.map((x) => ({ id: x.id, classeId: x.classe_id, matiere: x.matiere, titre: x.titre, pour: x.pour, prof: x.prof || "" }));
  b.espace.messages = T.messages.map((m) => ({ id: m.id, date: m.date, de: m.de, titre: m.titre, texte: m.texte, cible: m.cible || "" }));
  for (const h of [...T.horaire].sort((a, c) => String(a.debut).localeCompare(String(c.debut)))) (b.espace.horaire[h.classe_id] = b.espace.horaire[h.classe_id] || [[], [], [], [], []])[h.jour].push({ debut: h.debut, fin: h.fin, matiere: h.matiere, salle: h.salle || "", prof: h.prof || "", pause: !!h.pause });
  b.espace.calendrier = T.calendrier.map((e) => ({ id: e.id, date: e.date, type: e.type, titre: e.titre, detail: e.detail || "", classeId: e.classe_id || "" }));
  return b;
}
async function chargerNuage() {
  const { data: liens, error } = await sb.from("parents_eleves").select("eleve_id"); if (error) throw error;
  if (!liens.length) { nuage.etat = "rattacher"; nuage.msg = ""; rendre(); return; }
  nuage.etat = "attente"; rendre();
  const T = {}; for (const t of TABLES_NUAGE) T[t] = await lireNuage(t);
  S.base = baseDepuis(T);
  S.lus = (await lireNuage("lus")).map((r) => r.message_id);
  S.faits = (await lireNuage("devoirs_faits")).map((r) => r.devoir_id);
  S.demandes = (await lireNuage("demandes")).map((r) => ({ eleveId: r.eleve_id, titre: r.titre, date: String(r.date).slice(0, 10) }));
  await chargerEchanges();
  nuage.classements = {};
  for (const x of S.base.eleves) {
    nuage.classements[x.id] = {};
    for (let p = 0; p < PERIODES.length; p++) { if (!Object.keys(S.base.notes).some((k) => k.startsWith(x.id + "|") && k.endsWith("|" + p))) continue; const { data, error: er } = await sb.rpc("classement_eleve", { p_eleve: x.id, p_periode: p }); if (!er && data && data[0]) nuage.classements[x.id][p] = data[0]; }
  }
  if (!eleveActuel() && S.base.eleves.length === 1) S.matricule = S.base.eleves[0].matricule;
  nuage.etat = "pret"; sauver(); rendre();
}
async function chargerEchanges() {

  catch (e) {
    if (/echanges|schema cache|does not exist/i.test(String((e && e.message) || ""))) S.echanges = null; // messagerie pas encore activée par l'école
    else if (!Array.isArray(S.echanges)) S.echanges = []; // problème passager : on garde ce qu'on avait

}

window.addEventListener("error", (e) => { const m = document.getElementById("msg"); m.textContent = "Erreur : " + e.message; m.hidden = false; });
demarrerNuage();
</script>
